name: CI

# 注意：当前 GitHub 账号因账单问题被锁，Actions 无法运行。
# 修好账单后，把下面改成:
#   on:
#     push:
#     pull_request:
# 即可恢复自动检查。平时用 `bash scripts/check.sh` 本地检查。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m py_compile src/*.py experiments/*.py tests/*.py

      - name: 接口契约测试
        run: python tests/test_contract.py

      - name: 检查脚本入口
        run: |
          for f in src/*.py experiments/*.py; do
            python "$f" --help > /dev/null || { echo "::error file=$f::--help 执行失败"; exit 1; }
          done